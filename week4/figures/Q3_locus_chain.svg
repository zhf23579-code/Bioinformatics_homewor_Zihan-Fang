<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-wide" markerWidth="14" markerHeight="9" refX="14" refY="4.5" orient="auto">
      <polygon points="0 0, 14 4.5, 0 9" fill="#8e44ad"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #1a1a2e; }
      .label { font-size: 12px; fill: #333; }
      .small { font-size: 9px; fill: #555; }
      .layer-box { fill: none; stroke: #999; stroke-width: 1; rx: 5; }
      .access { fill: #e8f4f8; stroke: #2980b9; stroke-width: 2; rx: 8; }
      .histone { fill: #fef9e7; stroke: #f39c12; stroke-width: 2; rx: 8; }
      .meth { fill: #fdedec; stroke: #e74c3c; stroke-width: 2; rx: 8; }
      .contact { fill: #eafaf1; stroke: #27ae60; stroke-width: 2; rx: 8; }
      .expr { fill: #f4ecf7; stroke: #8e44ad; stroke-width: 2; rx: 8; }
      .perturb { fill: #fdf2e9; stroke: #e67e22; stroke-width: 2; rx: 8; }
      .track-label { font-size: 10px; fill: #777; font-style: italic; }
      .line { stroke: #333; stroke-width: 1.5; fill: none; }
      .dash { stroke: #666; stroke-width: 1; stroke-dasharray: 5,3; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Q3 - 多组学整合位点图：基因Y上游候选增强子</text>

  <!-- Chromosome / Locus -->
  <rect x="50" y="50" width="1000" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
  <text x="550" y="75" text-anchor="middle" class="title">基因组位点：基因Y上游 ~50 kb 候选调控区域（chrY: 100,000-150,000）</text>

  <!-- Gene annotation track -->
  <line x1="100" y1="100" x2="1000" y2="100" stroke="#333" stroke-width="2"/>
  <text x="900" y="108" class="small">← 基因Y 启动子 (-10kb)</text>
  <text x="100" y="108" class="small">候选增强子区域 (-50kb) →</text>
  <rect x="100" y="92" width="40" height="16" fill="#3498db" rx="3"/>
  <rect x="900" y="92" width="40" height="16" fill="#e74c3c" rx="3"/>

  <!-- Layer 1: ATAC-seq -->
  <rect class="access" x="50" y="130" width="1000" height="80"/>
  <text x="550" y="152" text-anchor="middle" class="title">1. 染色质可及性 — ATAC-seq</text>
  <text x="550" y="170" text-anchor="middle" class="label">直接观察：候选区域有明确的ATAC-seq峰，疾病组可及性显著高于对照组（log2FC > 2）</text>
  <text x="550" y="188" text-anchor="middle" class="small">解读：染色质开放，提示该区域是活性调控元件（增强子或启动子）的候选位点</text>
  <text x="550" y="200" text-anchor="middle" class="small">局限性：ATAC-seq不能区分具体结合的转录因子，也不能直接证明功能</text>

  <line class="line" x1="550" y1="210" x2="550" y2="230" marker-end="url(#arrow)"/>

  <!-- Layer 2: H3K27ac ChIP-seq -->
  <rect class="histone" x="50" y="235" width="1000" height="80"/>
  <text x="550" y="257" text-anchor="middle" class="title">2. 染色质状态 — H3K27ac ChIP-seq/CUT&Tag</text>
  <text x="550" y="275" text-anchor="middle" class="label">直接观察：候选区域有强H3K27ac信号（活性增强子标记），疾病组>对照组（~3倍）</text>
  <text x="550" y="293" text-anchor="middle" class="small">解读：H3K27ac修饰活性增强子和启动子，与ATAC-seq峰重叠，符合活性增强子特征</text>
  <text x="550" y="305" text-anchor="middle" class="small">局限性：只有H3K27ac一个标记，缺乏H3K4me1（增强子标记）和H3K4me3（启动子标记）区分</text>

  <line class="line" x1="550" y1="315" x2="550" y2="335" marker-end="url(#arrow)"/>

  <!-- Layer 3: DNA methylation -->
  <rect class="meth" x="50" y="340" width="1000" height="80"/>
  <text x="550" y="362" text-anchor="middle" class="title">3. DNA甲基化 — WGBS/EM-seq</text>
  <text x="550" y="380" text-anchor="middle" class="label">直接观察：候选区域为低甲基化状态（平均甲基化水平 ~15%），疾病组略低于对照组</text>
  <text x="550" y="398" text-anchor="middle" class="small">解读：活性增强子通常处于低甲基化状态，与ATAC-seq和H3K27ac数据一致</text>
  <text x="550" y="410" text-anchor="middle" class="small">局限性：甲基化变化幅度较小，单独作用不足以证明功能性增强</text>

  <line class="line" x1="550" y1="420" x2="550" y2="440" marker-end="url(#arrow)"/>

  <!-- Layer 4: Hi-C -->
  <rect class="contact" x="50" y="445" width="1000" height="80"/>
  <text x="550" y="467" text-anchor="middle" class="title">4. 3D基因组接触 — Hi-C / Micro-C</text>
  <text x="550" y="485" text-anchor="middle" class="label">直接观察：Hi-C显示候选区域与基因Y启动子之间存在显著染色质环（contact score > 5）</text>
  <text x="550" y="503" text-anchor="middle" class="small">解读：3D空间靠近是增强子-启动子通讯的结构基础，提供了接触机制证据</text>
  <text x="550" y="515" text-anchor="middle" class="small">局限性：接触不等于功能互作；Hi-C分辨率有限；需要Micro-C或PLAC-seq确认</text>

  <line class="line" x1="550" y1="525" x2="550" y2="545" marker-end="url(#arrow)"/>

  <!-- Layer 5: RNA-seq -->
  <rect class="expr" x="50" y="550" width="1000" height="80"/>
  <text x="550" y="572" text-anchor="middle" class="title">5. 基因表达 — RNA-seq</text>
  <text x="550" y="590" text-anchor="middle" class="label">直接观察：基因Y在疾病组中表达上调（log2FC = 1.8, adjusted p < 0.01）</text>
  <text x="550" y="608" text-anchor="middle" class="small">解读：基因Y表达变化与增强子活性的增加方向一致，提供了功能关联证据</text>
  <text x="550" y="620" text-anchor="middle" class="small">局限性：相关性不等于因果关系；其他调控机制也可能导致基因Y上调</text>

  <line class="line" x1="550" y1="630" x2="550" y2="650" marker-end="url(#arrow)"/>

  <!-- Integration -->
  <rect class="meth" x="150" y="655" width="800" height="35" fill="#fdedec" opacity="0.3"/>
  <text x="550" y="678" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">整合：所有5层数据一致支持 → 候选区域是基因Y的活性增强子</text>

  <line class="line" x1="550" y1="690" x2="550" y2="710" marker-end="url(#arrow)"/>

  <!-- Functional Perturbation -->
  <rect class="perturb" x="150" y="715" width="800" height="60"/>
  <text x="550" y="737" text-anchor="middle" class="title">6. 功能扰动实验（区分相关性与因果关系）</text>
  <text x="550" y="755" text-anchor="middle" class="label">CRISPRi 干扰候选增强子 → 预期：基因Y表达下降 → 因果关系成立</text>
  <text x="550" y="768" text-anchor="middle" class="small">对照：非靶向sgRNA + 已知阴性区域；备用方案：增强子删除 + MPRA验证</text>

  <line class="line" x1="550" y1="775" x2="550" y2="795" marker-end="url(#arrow)"/>

  <!-- Conclusion -->
  <rect x="150" y="800" width="800" height="35" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2" rx="8"/>
  <text x="550" y="823" text-anchor="middle" class="title">结论：候选区域通过染色质环接触基因Y启动子，以活性增强子机制调控基因Y表达</text>
</svg>